name: Release

# Push a tag like v0.1.0 to build the Windows installer and attach it to a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish the installer under (e.g. v0.1.0). Leave empty to only build the artifact."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build requirements
        run: |
          pip install . pyinstaller
          choco install innosetup -y --no-progress
      - name: Build uswap.exe (PyInstaller, one folder)
        run: >
          python -m PyInstaller packaging/uswap_entry.py --name uswap --onedir --noconfirm
          --icon assets/uswap.ico
          --add-data "uswap/locales;uswap/locales"
          --collect-submodules PIL --collect-submodules watchdog --collect-submodules rich
      - name: Fetch FFmpeg, Pandoc and Poppler
        shell: pwsh
        run: ./packaging/windows/fetch-tools.ps1
      - name: Build installer
        shell: pwsh
        run: |
          $v = (Get-Content uswap/__init__.py | Select-String '__version__ = "(.+)"').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" packaging\windows\uswap.iss
      - name: Smoke test the built executable
        shell: pwsh
        run: dist\uswap\uswap.exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: USwap-Setup
          path: dist/USwap-Setup.exe
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/USwap-Setup.exe
          generate_release_notes: true
